[project]
name = "geolgm-trainer"
version = "0.1.0"
description = "Config-driven PyTorch training + geospatial-style data pipeline with tracking and dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adeosun" }]
keywords = ["pytorch", "geospatial", "training", "tracking", "streamlit"]

dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "pydantic>=2.6.0",
  "pyyaml>=6.0.1",
  "matplotlib>=3.8.0",
  "tqdm>=4.66.0",
  "psutil>=5.9.0",
  "streamlit>=1.31.0",
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "boto3>=1.34.0",
  "pillow>=10.2.0",
]

[project.optional-dependencies]
train = ["torch", "torchvision"]

[project.scripts]
geolgm = "geolgm.cli:main"

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
